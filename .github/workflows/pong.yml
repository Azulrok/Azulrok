name: Pong

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Atualizar o Pong dos commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar Pong
        run: python .github/scripts/pong.py
        env:
          GITHUB_USER: Azulrok

      - name: Publicar no perfil
        run: |
          git add assets/pong.svg
          git diff --staged --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update pong"
          git push
